name: family_monitor

description: Family Monitor - Transparent parental monitoring app

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.1.4
  firebase_messaging: ^15.1.0
  firebase_storage: ^12.3.2

  permission_handler: ^11.3.1
  flutter_foreground_task: ^8.14.0
  flutter_background_service: ^5.0.9
  flutter_background_service_android: ^6.2.2

  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  geolocator: ^11.1.0
  flutter_map: ^6.2.1
  latlong2: ^0.9.1

  usage_stats: ^1.3.1
  fl_chart: ^0.68.0

  camera: ^0.10.5+9
  path_provider: ^2.1.4
  flutter_contacts: ^1.1.7+1

  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1

  uuid: ^4.4.0

  battery_plus: ^6.0.3
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.3
  wakelock_plus: ^1.2.5

  flutter_webrtc: ^0.11.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

