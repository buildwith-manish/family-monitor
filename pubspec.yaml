name: family_monitor
description: Family Monitor - Transparent parental monitoring app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.1.4
  firebase_storage: ^12.3.2
  permission_handler: ^11.3.1
  flutter_foreground_task: ^9.2.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.6
  geolocator: ^11.1.0
  flutter_map: ^6.2.1
  latlong2: ^0.9.1
  usage_stats: ^1.3.1
  fl_chart: ^0.63.0
  camera: ^0.10.5+9
  path_provider: ^2.1.1
  flutter_contacts: ^1.1.7+1
  google_fonts: ^6.2.1
  flutter_animate: ^4.3.0
  lottie: ^2.7.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  uuid: ^4.2.2
  shared_preferences: ^2.2.2
  connectivity_plus: ^5.0.2
  wakelock_plus: ^1.1.4
  flutter_webrtc: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
