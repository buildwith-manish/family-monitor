workflows:
  android-apk:
    name: Build Parent and Child APKs
    instance_type: mac_mini_m4

    environment:
      flutter: stable
      java: 17
      # Set GOOGLE_SERVICES_JSON in Codemagic UI → Environment Variables
      # Value = full text of android/app/google-services.json

    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/.gradle/caches
        - ~/.gradle/wrapper

    scripts:
      - name: Write google-services.json
        script: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Flutter clean
        script: flutter clean

      - name: Get dependencies
        script: flutter pub get

      - name: Build Parent APK
        script: |
          flutter build apk --release \
            --flavor parent \
            --target lib/main_parent.dart \
            --no-tree-shake-icons

          cp build/app/outputs/flutter-apk/app-parent-release.apk \
             build/app/outputs/flutter-apk/parent-release.apk

      - name: Build Child APK
        script: |
          flutter build apk --release \
            --flavor child \
            --target lib/main_child.dart \
            --no-tree-shake-icons

          cp build/app/outputs/flutter-apk/app-child-release.apk \
             build/app/outputs/flutter-apk/child-release.apk

    artifacts:
      - build/app/outputs/flutter-apk/parent-release.apk
      - build/app/outputs/flutter-apk/child-release.apk
