workflows:
  android-apk:
    name: Build Parent and Child APKs
    instance_type: mac_mini_m4
    environment:
      flutter: 3.27.4
      java: 17
    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/.gradle/caches
        - ~/.gradle/wrapper
    scripts:
      - name: Get dependencies
        script: flutter pub get

      - name: Patch plugin gradle files
        script: |
          find $HOME/.pub-cache -name "build.gradle" -exec sed -i \
            's/flutter\.compileSdkVersion/36/g; s/flutter\.minSdkVersion/24/g; s/flutter\.targetSdkVersion/36/g' {} \;
          find $HOME/.pub-cache -name "build.gradle.kts" -exec sed -i \
            's/flutter\.compileSdkVersion/36/g; s/flutter\.minSdkVersion/24/g; s/flutter\.targetSdkVersion/36/g' {} \;

      - name: Build Parent APK
        script: |
          flutter build apk --profile \
            --flavor parent \
            --target lib/main_parent.dart \
            --no-tree-shake-icons \
            --android-skip-build-dependency-validation
          mkdir -p build/app/outputs/flutter-apk
          APK=$(find . -name "*parent*.apk" 2>/dev/null | head -1)
          [ -n "$APK" ] && cp "$APK" build/app/outputs/flutter-apk/parent-release.apk && echo "Parent done!" || exit 1

      - name: Build Child APK
        script: |
          flutter build apk --profile \
            --flavor child \
            --target lib/main_child.dart \
            --no-tree-shake-icons \
            --android-skip-build-dependency-validation
          APK=$(find . -name "*child*.apk" 2>/dev/null | head -1)
          [ -n "$APK" ] && cp "$APK" build/app/outputs/flutter-apk/child-release.apk && echo "Child done!" || exit 1

    artifacts:
      - build/app/outputs/flutter-apk/parent-release.apk
      - build/app/outputs/flutter-apk/child-release.apk
