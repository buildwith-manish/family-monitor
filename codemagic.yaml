workflows:
  android-apk:
    name: Build Parent and Child APKs
    instance_type: mac_mini_m4

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    environment:
      flutter: stable
      java: 17

    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/.gradle/caches
        - ~/.gradle/wrapper

    scripts:
      - name: Write google-services.json
        script: |
          cat > android/app/google-services.json << 'GSJSON'
          {
            "project_info": {
              "project_number": "758644747673",
              "firebase_url": "https://family-monitor-7aab3-default-rtdb.firebaseio.com",
              "project_id": "family-monitor-7aab3",
              "storage_bucket": "family-monitor-7aab3.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:758644747673:android:69ef23a2fa4b508122f708",
                  "android_client_info": {
                    "package_name": "com.example.family_monitor"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key": "AIzaSyAbX2gNNW3iZCIgn2UJjtbZdtQHM3CyjW4"}],
                "services": {"appinvite_service": {"other_platform_oauth_client": []}}
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:758644747673:android:32a2141244fb9c3222f708",
                  "android_client_info": {
                    "package_name": "com.example.family_monitor.child"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key": "AIzaSyAbX2gNNW3iZCIgn2UJjtbZdtQHM3CyjW4"}],
                "services": {"appinvite_service": {"other_platform_oauth_client": []}}
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:758644747673:android:ea45b7a53b3f2f2e22f708",
                  "android_client_info": {
                    "package_name": "com.example.family_monitor.parent"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key": "AIzaSyAbX2gNNW3iZCIgn2UJjtbZdtQHM3CyjW4"}],
                "services": {"appinvite_service": {"other_platform_oauth_client": []}}
              }
            ],
            "configuration_version": "1"
          }
          GSJSON

      - name: Get dependencies
        script: flutter pub get

      - name: Validate Gradle KTS syntax
        script: |
          echo "Scanning .gradle.kts files for Groovy-style syntax..."
          ERRORS=0

          # Detect bare double-quoted strings used as dependency notation (Groovy style)
          # Valid KTS uses:  implementation("...")
          # Invalid Groovy:  implementation "..."
          GROOVY_DEPS=$(grep -rn --include="*.gradle.kts" \
            -E '^\s*(implementation|api|compileOnly|runtimeOnly|testImplementation|androidTestImplementation|annotationProcessor|kapt|ksp|coreLibraryDesugaring)\s+"' \
            android/ || true)

          if [ -n "$GROOVY_DEPS" ]; then
            echo ""
            echo "ERROR: Groovy-style dependency syntax found in .gradle.kts file(s)."
            echo "Use parentheses in Kotlin DSL:  implementation(\"...\")  not  implementation \"...\""
            echo ""
            echo "$GROOVY_DEPS"
            ERRORS=$((ERRORS + 1))
          fi

          # Detect single-quoted strings (also Groovy style)
          SINGLE_QUOTED=$(grep -rn --include="*.gradle.kts" \
            -E "^\s*(implementation|api|compileOnly|runtimeOnly|testImplementation|androidTestImplementation|annotationProcessor|kapt|ksp|coreLibraryDesugaring)\s+'" \
            android/ || true)

          if [ -n "$SINGLE_QUOTED" ]; then
            echo ""
            echo "ERROR: Single-quoted dependency syntax found in .gradle.kts file(s)."
            echo "Use double-quoted strings inside parentheses:  implementation(\"...\")"
            echo ""
            echo "$SINGLE_QUOTED"
            ERRORS=$((ERRORS + 1))
          fi

          # Detect apply plugin Groovy style
          APPLY_PLUGIN=$(grep -rn --include="*.gradle.kts" \
            -E "^apply plugin\s*:" \
            android/ || true)

          if [ -n "$APPLY_PLUGIN" ]; then
            echo ""
            echo "ERROR: Groovy-style 'apply plugin:' found in .gradle.kts file(s)."
            echo "Use Kotlin DSL:  apply(plugin = \"...\")"
            echo ""
            echo "$APPLY_PLUGIN"
            ERRORS=$((ERRORS + 1))
          fi

          if [ "$ERRORS" -eq 0 ]; then
            echo "All .gradle.kts files passed syntax validation."
          else
            echo ""
            echo "Fix the $ERRORS error(s) above before building."
            exit 1
          fi

      - name: Build Parent APK
        script: |
          flutter build apk --release \
            --flavor parent \
            --target lib/main_parent.dart \
            --no-tree-shake-icons

          mkdir -p build/app/outputs/flutter-apk

          PARENT_APK=$(find build android/app/build android/build -name "app-parent-release.apk" 2>/dev/null | head -1)
          [ -z "$PARENT_APK" ] && PARENT_APK=$(find build android/app/build android/build -name "*parent*release*.apk" 2>/dev/null | head -1)

          if [ -z "$PARENT_APK" ]; then
            echo "ERROR: Parent APK not found"
            exit 1
          fi

          echo "Found parent APK at: $PARENT_APK"
          cp "$PARENT_APK" build/app/outputs/flutter-apk/parent-release.apk
          du -h build/app/outputs/flutter-apk/parent-release.apk

      - name: Build Child APK
        script: |
          flutter build apk --release \
            --flavor child \
            --target lib/main_child.dart \
            --no-tree-shake-icons

          mkdir -p build/app/outputs/flutter-apk

          CHILD_APK=$(find android/app/build -name "app-child-release.apk" 2>/dev/null | head -1)
          [ -z "$CHILD_APK" ] && CHILD_APK=$(find android/build -name "app-child-release.apk" 2>/dev/null | head -1)
          [ -z "$CHILD_APK" ] && CHILD_APK=$(find build/app/outputs/flutter-apk -name "app-child-release.apk" 2>/dev/null | head -1)
          [ -z "$CHILD_APK" ] && CHILD_APK=$(find android/app/build -name "*child*release*.apk" 2>/dev/null | head -1)

          if [ -z "$CHILD_APK" ]; then
            echo "ERROR: Child APK not found"
            exit 1
          fi

          echo "Found child APK at: $CHILD_APK"
          cp "$CHILD_APK" build/app/outputs/flutter-apk/child-release.apk
          du -h build/app/outputs/flutter-apk/child-release.apk

    artifacts:
      - build/app/outputs/flutter-apk/parent-release.apk
      - build/app/outputs/flutter-apk/child-release.apk
