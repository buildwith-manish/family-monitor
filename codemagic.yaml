workflows:
  android-apk:
    name: Build Parent and Child APKs
    instance_type: mac_mini_m4
    environment:
      flutter: 3.41.9
      java: 17
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Build Parent APK
        script: |
          flutter build apk --debug \
            --target lib/main_parent.dart \
            --no-tree-shake-icons \
            --android-skip-build-dependency-validation
          mkdir -p build/app/outputs/flutter-apk
          cp build/app/outputs/flutter-apk/app-debug.apk \
             build/app/outputs/flutter-apk/parent-debug.apk
      - name: Build Child APK
        script: |
          flutter build apk --debug \
            --target lib/main_child.dart \
            --no-tree-shake-icons \
            --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-debug.apk \
             build/app/outputs/flutter-apk/child-debug.apk
    artifacts:
      - build/app/outputs/flutter-apk/parent-debug.apk
      - build/app/outputs/flutter-apk/child-debug.apk
