workflows:
  android-apk:
    name: Build APK
    instance_type: mac_mini_m4
    environment:
      flutter: 3.22.3
      java: 17
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --debug --no-tree-shake-icons
      - name: Find APK
        script: find . -name "*.apk" 2>/dev/null
    artifacts:
      - "**/*.apk"
