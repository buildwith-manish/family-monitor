workflows:
  android-apk:
    name: Build Parent and Child APKs
    instance_type: mac_mini_m4

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    environment:
      flutter: stable
      java: 17
      groups:
        - firebase_credentials   # FIREBASE_TOKEN must be added in Codemagic → Teams → Environment variable groups

    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/.gradle/caches
        - ~/.gradle/wrapper

    scripts:
      - name: Write google-services.json
        script: |
          cat > android/app/google-services.json << 'GSJSON'
          {
            "project_info": {
              "project_number": "758644747673",
              "firebase_url": "https://family-monitor-7aab3-default-rtdb.firebaseio.com",
              "project_id": "family-monitor-7aab3",
              "storage_bucket": "family-monitor-7aab3.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:758644747673:android:69ef23a2fa4b508122f708",
                  "android_client_info": {
                    "package_name": "com.example.family_monitor"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key": "AIzaSyAbX2gNNW3iZCIgn2UJjtbZdtQHM3CyjW4"}],
                "services": {"appinvite_service": {"other_platform_oauth_client": []}}
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:758644747673:android:32a2141244fb9c3222f708",
                  "android_client_info": {
                    "package_name": "com.example.family_monitor.child"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key": "AIzaSyAbX2gNNW3iZCIgn2UJjtbZdtQHM3CyjW4"}],
                "services": {"appinvite_service": {"other_platform_oauth_client": []}}
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:758644747673:android:ea45b7a53b3f2f2e22f708",
                  "android_client_info": {
                    "package_name": "com.example.family_monitor.parent"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key": "AIzaSyAbX2gNNW3iZCIgn2UJjtbZdtQHM3CyjW4"}],
                "services": {"appinvite_service": {"other_platform_oauth_client": []}}
              }
            ],
            "configuration_version": "1"
          }
          GSJSON

      - name: Get dependencies
        script: flutter pub get

      # ── GATE 1: Dart format check ─────────────────────────────────────────────
      # Fails immediately if any Dart file has formatting issues.
      # Runs before analyze and build so formatting problems are caught first.
      - name: Dart format check
        script: |
          echo "Checking Dart formatting..."
          UNFORMATTED=$(dart format --output=none --set-exit-if-changed lib/ 2>&1 || true)
          if echo "$UNFORMATTED" | grep -q "Formatted"; then
            echo ""
            echo "ERROR: The following Dart files are not formatted correctly:"
            echo "$UNFORMATTED"
            echo ""
            echo "Run 'dart format lib/' locally and commit the result."
            exit 1
          fi
          echo "All Dart files are correctly formatted."

      # ── GATE 2: Flutter analyze ───────────────────────────────────────────────
      # Catches Dart type errors, missing imports, and lint issues before
      # the 3-minute Gradle build even starts — saving significant CI time.
      - name: Flutter analyze
        script: |
          echo "Running flutter analyze..."
          flutter analyze --no-pub 2>&1 | tee /tmp/analyze.log
          # Fail only on errors, not on info/warnings
          if grep -qE "^  error •" /tmp/analyze.log; then
            echo ""
            echo "ERROR: flutter analyze found errors. Fix them before building."
            exit 1
          fi
          echo "Flutter analyze passed."

      # ── GATE 3: Validate Gradle KTS syntax + manifest ────────────────────────
      - name: Validate Gradle KTS syntax
        script: |
          echo "Scanning .gradle.kts files for Groovy-style syntax..."
          ERRORS=0

          GROOVY_DEPS=$(grep -rn --include="*.gradle.kts" \
            -E '^\s*(implementation|api|compileOnly|runtimeOnly|testImplementation|androidTestImplementation|annotationProcessor|kapt|ksp|coreLibraryDesugaring)\s+"' \
            android/ || true)

          if [ -n "$GROOVY_DEPS" ]; then
            echo ""
            echo "ERROR: Groovy-style dependency syntax found in .gradle.kts file(s)."
            echo "Use parentheses in Kotlin DSL:  implementation(\"...\")  not  implementation \"...\""
            echo ""
            echo "$GROOVY_DEPS"
            ERRORS=$((ERRORS + 1))
          fi

          SINGLE_QUOTED=$(grep -rn --include="*.gradle.kts" \
            -E "^\s*(implementation|api|compileOnly|runtimeOnly|testImplementation|androidTestImplementation|annotationProcessor|kapt|ksp|coreLibraryDesugaring)\s+'" \
            android/ || true)

          if [ -n "$SINGLE_QUOTED" ]; then
            echo ""
            echo "ERROR: Single-quoted dependency syntax found in .gradle.kts file(s)."
            echo "Use double-quoted strings inside parentheses:  implementation(\"...\")"
            echo ""
            echo "$SINGLE_QUOTED"
            ERRORS=$((ERRORS + 1))
          fi

          APPLY_PLUGIN=$(grep -rn --include="*.gradle.kts" \
            -E "^apply plugin\s*:" \
            android/ || true)

          if [ -n "$APPLY_PLUGIN" ]; then
            echo ""
            echo "ERROR: Groovy-style 'apply plugin:' found in .gradle.kts file(s)."
            echo "Use Kotlin DSL:  apply(plugin = \"...\")"
            echo ""
            echo "$APPLY_PLUGIN"
            ERRORS=$((ERRORS + 1))
          fi

          echo "Scanning AndroidManifest.xml for duplicate permissions..."
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            DUPES=$(grep -o 'android:name="android\.permission\.[^"]*"' "$MANIFEST" \
              | sort | uniq -d)
            if [ -n "$DUPES" ]; then
              echo ""
              echo "ERROR: Duplicate uses-permission entries found in AndroidManifest.xml:"
              echo "$DUPES"
              echo "Remove the duplicate declaration(s) — each permission must appear only once."
              ERRORS=$((ERRORS + 1))
            fi
          fi

          if [ "$ERRORS" -eq 0 ]; then
            echo "All checks passed."
          else
            echo ""
            echo "Fix the $ERRORS error(s) above before building."
            exit 1
          fi

      # ── BUILD: Parent APK ─────────────────────────────────────────────────────
      - name: Build Parent APK
        script: |
          # Auto version code: total git commit count ensures every build is unique
          # and traceable back to a specific commit without manual bumping.
          GIT_COMMIT_COUNT=$(git rev-list --count HEAD)
          GIT_SHORT_SHA=$(git rev-parse --short HEAD)
          echo "Version code: $GIT_COMMIT_COUNT  |  SHA: $GIT_SHORT_SHA"

          flutter build apk --release \
            --flavor parent \
            --target lib/main_parent.dart \
            --no-tree-shake-icons \
            --build-number="$GIT_COMMIT_COUNT" \
            --build-name="1.0.$GIT_COMMIT_COUNT"

          mkdir -p build/app/outputs/flutter-apk

          PARENT_APK=$(find build android/app/build android/build -name "app-parent-release.apk" 2>/dev/null | head -1)
          [ -z "$PARENT_APK" ] && PARENT_APK=$(find build android/app/build android/build -name "*parent*release*.apk" 2>/dev/null | head -1)

          if [ -z "$PARENT_APK" ]; then
            echo "ERROR: Parent APK not found"
            exit 1
          fi

          echo "Found parent APK at: $PARENT_APK"
          cp "$PARENT_APK" build/app/outputs/flutter-apk/parent-release.apk
          du -h build/app/outputs/flutter-apk/parent-release.apk

      # ── BUILD: Child APK ──────────────────────────────────────────────────────
      - name: Build Child APK
        script: |
          GIT_COMMIT_COUNT=$(git rev-list --count HEAD)
          GIT_SHORT_SHA=$(git rev-parse --short HEAD)
          echo "Version code: $GIT_COMMIT_COUNT  |  SHA: $GIT_SHORT_SHA"

          flutter build apk --release \
            --flavor child \
            --target lib/main_child.dart \
            --no-tree-shake-icons \
            --build-number="$GIT_COMMIT_COUNT" \
            --build-name="1.0.$GIT_COMMIT_COUNT"

          mkdir -p build/app/outputs/flutter-apk

          CHILD_APK=$(find android/app/build -name "app-child-release.apk" 2>/dev/null | head -1)
          [ -z "$CHILD_APK" ] && CHILD_APK=$(find android/build -name "app-child-release.apk" 2>/dev/null | head -1)
          [ -z "$CHILD_APK" ] && CHILD_APK=$(find build/app/outputs/flutter-apk -name "app-child-release.apk" 2>/dev/null | head -1)
          [ -z "$CHILD_APK" ] && CHILD_APK=$(find android/app/build -name "*child*release*.apk" 2>/dev/null | head -1)

          if [ -z "$CHILD_APK" ]; then
            echo "ERROR: Child APK not found"
            exit 1
          fi

          echo "Found child APK at: $CHILD_APK"
          cp "$CHILD_APK" build/app/outputs/flutter-apk/child-release.apk
          du -h build/app/outputs/flutter-apk/child-release.apk

      # ── MAPPING: Archive ProGuard/R8 mapping files ───────────────────────────
      # The Gradle Crashlytics plugin uploads mapping files automatically during
      # the build (mappingFileUploadEnabled = true in build.gradle.kts).
      # This step copies them to a known location for artifact archiving and
      # prints a confirmation so it's easy to verify in the build log.
      - name: Archive ProGuard mapping files
        script: |
          echo "Locating R8 mapping files..."
          MAPPING_DIR="build/app/outputs/mapping"
          mkdir -p "$MAPPING_DIR"

          # Parent mapping
          PARENT_MAP=$(find android/app/build/outputs/mapping -name "mapping.txt" \
            -path "*parent*" 2>/dev/null | head -1)
          if [ -n "$PARENT_MAP" ]; then
            cp "$PARENT_MAP" "$MAPPING_DIR/parent-release-mapping.txt"
            echo "Parent mapping: $(wc -l < "$MAPPING_DIR/parent-release-mapping.txt") lines"
          else
            echo "WARNING: Parent mapping file not found (mapping upload still handled by Gradle plugin)"
          fi

          # Child mapping
          CHILD_MAP=$(find android/app/build/outputs/mapping -name "mapping.txt" \
            -path "*child*" 2>/dev/null | head -1)
          if [ -n "$CHILD_MAP" ]; then
            cp "$CHILD_MAP" "$MAPPING_DIR/child-release-mapping.txt"
            echo "Child mapping: $(wc -l < "$MAPPING_DIR/child-release-mapping.txt") lines"
          else
            echo "WARNING: Child mapping file not found (mapping upload still handled by Gradle plugin)"
          fi

          echo "Mapping files archived to $MAPPING_DIR"

      # ── DISTRIBUTE: Firebase App Distribution ────────────────────────────────
      # Uploads both APKs to Firebase App Distribution after a successful build.
      # Testers receive an email with a download link automatically.
      #
      # SETUP REQUIRED (one-time):
      #   1. In Firebase Console → Family Monitor project → App Distribution
      #      → enable it for both the parent and child apps.
      #   2. Run `firebase login:ci` locally, copy the token.
      #   3. In Codemagic → Teams → Global variables → add a group called
      #      "firebase_credentials" with variable FIREBASE_TOKEN = <your token>.
      #   4. Replace PARENT_APP_ID and CHILD_APP_ID below with the actual
      #      Firebase App IDs from the Firebase Console (Project Settings → Apps).
      - name: Distribute to Firebase App Distribution
        script: |
          # Replace these with your real Firebase App IDs from the Firebase Console:
          #   Project Settings → Your Apps → App ID
          PARENT_APP_ID="1:758644747673:android:ea45b7a53b3f2f2e22f708"
          CHILD_APP_ID="1:758644747673:android:32a2141244fb9c3222f708"

          GIT_SHORT_SHA=$(git rev-parse --short HEAD)
          GIT_MSG=$(git log -1 --pretty=format:"%s")
          RELEASE_NOTES="Build from commit $GIT_SHORT_SHA: $GIT_MSG"

          # Install Firebase CLI if not already cached
          if ! command -v firebase &> /dev/null; then
            echo "Installing Firebase CLI..."
            npm install -g firebase-tools@latest --silent
          fi

          echo "Uploading Parent APK to Firebase App Distribution..."
          firebase appdistribution:distribute \
            build/app/outputs/flutter-apk/parent-release.apk \
            --app "$PARENT_APP_ID" \
            --release-notes "$RELEASE_NOTES" \
            --groups "testers" \
            --token "$FIREBASE_TOKEN"

          echo "Uploading Child APK to Firebase App Distribution..."
          firebase appdistribution:distribute \
            build/app/outputs/flutter-apk/child-release.apk \
            --app "$CHILD_APP_ID" \
            --release-notes "$RELEASE_NOTES" \
            --groups "testers" \
            --token "$FIREBASE_TOKEN"

          echo "Both APKs distributed successfully."

    artifacts:
      - build/app/outputs/flutter-apk/parent-release.apk
      - build/app/outputs/flutter-apk/child-release.apk
      - build/app/outputs/mapping/parent-release-mapping.txt
      - build/app/outputs/mapping/child-release-mapping.txt
