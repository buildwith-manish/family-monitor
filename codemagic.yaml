workflows:
  android-apk:
    name: Build Parent and Child APKs
    instance_type: mac_mini_m4
    environment:
      flutter: 3.41.9
      java: 17
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Build Parent APK
        script: |
          flutter build apk --debug \
            --flavor parent \
            --target lib/main_parent.dart \
            --no-tree-shake-icons \
            --android-skip-build-dependency-validation || true
          mkdir -p build/app/outputs/flutter-apk
          APK=$(find . -name "*parent*.apk" 2>/dev/null | head -1)
          [ -n "$APK" ] && cp "$APK" build/app/outputs/flutter-apk/parent-debug.apk && echo "Parent done!" || exit 1
      - name: Build Child APK
        script: |
          flutter build apk --debug \
            --flavor child \
            --target lib/main_child.dart \
            --no-tree-shake-icons \
            --android-skip-build-dependency-validation || true
          APK=$(find . -name "*child*.apk" 2>/dev/null | head -1)
          [ -n "$APK" ] && cp "$APK" build/app/outputs/flutter-apk/child-debug.apk && echo "Child done!" || exit 1
    artifacts:
      - build/app/outputs/flutter-apk/parent-debug.apk
      - build/app/outputs/flutter-apk/child-debug.apk
      - "**/*.apk"
