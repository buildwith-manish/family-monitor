workflows:
  android-apk:
    name: Build Parent and Child APKs
    instance_type: mac_mini_m4
    environment:
      flutter: 3.27.4
      java: 17
    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/.gradle/caches
        - ~/.gradle/wrapper
    scripts:
      - name: Get dependencies
        script: flutter pub get

      - name: Patch plugin gradle files
        script: |
          find $HOME/.pub-cache -name "build.gradle" -exec sed -i \
            's/flutter\.compileSdkVersion/36/g; s/flutter\.minSdkVersion/24/g; s/flutter\.targetSdkVersion/36/g' {} \;
          find $HOME/.pub-cache -name "build.gradle.kts" -exec sed -i \
            's/flutter\.compileSdkVersion/36/g; s/flutter\.minSdkVersion/24/g; s/flutter\.targetSdkVersion/36/g' {} \;

      - name: Build Parent APK
        script: |
          flutter build apk --release \
            --flavor parent \
            --target lib/main_parent.dart \
            --no-tree-shake-icons
          mkdir -p build/app/outputs/flutter-apk
          cp build/app/outputs/flutter-apk/app-parent-release.apk \
             build/app/outputs/flutter-apk/parent-release.apk

      - name: Build Child APK
        script: |
          flutter build apk --release \
            --flavor child \
            --target lib/main_child.dart \
            --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-child-release.apk \
             build/app/outputs/flutter-apk/child-release.apk

    artifacts:
      - build/app/outputs/flutter-apk/parent-release.apk
      - build/app/outputs/flutter-apk/child-release.apk
