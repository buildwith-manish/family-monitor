name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - run: flutter pub get
      - name: Patch flutter SDK refs in plugins
        run: |
          find $HOME/.pub-cache -name "build.gradle" -exec sed -i \
            's/flutter\.compileSdkVersion/36/g; s/flutter\.minSdkVersion/24/g; s/flutter\.targetSdkVersion/36/g' {} \;
          find $HOME/.pub-cache -name "build.gradle.kts" -exec sed -i \
            's/flutter\.compileSdkVersion/36/g; s/flutter\.minSdkVersion/24/g; s/flutter\.targetSdkVersion/36/g' {} \;
      - name: Build APK
        run: flutter build apk --debug
      - name: Ensure APK in Flutter path
        run: |
          mkdir -p build/app/outputs/flutter-apk
          APK=$(find . -name "*.apk" -not -path "*/flutter-apk/*" 2>/dev/null | head -1)
          if [ -n "$APK" ] && [ ! -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            cp "$APK" build/app/outputs/flutter-apk/app-debug.apk
            echo "Copied APK from: $APK"
          fi
          ls -la build/app/outputs/flutter-apk/ || echo "No APK found"
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: "**/*.apk"
          if-no-files-found: warn
