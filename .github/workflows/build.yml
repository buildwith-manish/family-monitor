name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - run: flutter pub get
      - name: Patch flutter SDK refs in plugins
        run: |
          find $HOME/.pub-cache -name "build.gradle" -exec sed -i \
            's/flutter\.compileSdkVersion/36/g; s/flutter\.minSdkVersion/24/g; s/flutter\.targetSdkVersion/36/g' {} \;
          find $HOME/.pub-cache -name "build.gradle.kts" -exec sed -i \
            's/flutter\.compileSdkVersion/36/g; s/flutter\.minSdkVersion/24/g; s/flutter\.targetSdkVersion/36/g' {} \;
      - name: Build APK (gradle direct)
        run: |
          cd android
          ./gradlew assembleDebug
      - name: Copy APK to Flutter expected location
        run: |
          mkdir -p build/app/outputs/flutter-apk
          find . -name "*.apk" -not -path "*/flutter-apk/*" | head -1 | xargs -I{} cp {} build/app/outputs/flutter-apk/app-debug.apk
          echo "APK copied:"
          ls -la build/app/outputs/flutter-apk/
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
