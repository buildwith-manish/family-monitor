name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable

      - name: Setup & Build
        run: |
          cd $GITHUB_WORKSPACE/family_monitor
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "kotlin.jvm.target.validation.mode=IGNORE" >> android/gradle.properties
          flutter pub get
          ln -sf $GITHUB_WORKSPACE/family_monitor/.dart_tool $GITHUB_WORKSPACE/family_monitor/android/.dart_tool
          flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: family_monitor/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
