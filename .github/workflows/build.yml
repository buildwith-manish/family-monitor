name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.0
          channel: stable


      - name: Fix dependencies
        working-directory: family_monitor
        run: |
          sed -i 's/google_fonts: .*/google_fonts: ^6.2.1/' pubspec.yaml
          sed -i 's/fl_chart: .*/fl_chart: ^1.1.0/' pubspec.yaml

      - name: Flutter pub get
        working-directory: family_monitor
        run: flutter pub get

      - name: Build APK
        working-directory: family_monitor
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: family_monitor/build/app/outputs/flutter-apk/app-debug.apk
