name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - run: flutter pub get
      - name: Patch flutter SDK refs in plugins
        run: |
          find $HOME/.pub-cache -name "build.gradle" -exec sed -i \
            's/flutter\.compileSdkVersion/36/g; s/flutter\.minSdkVersion/24/g; s/flutter\.targetSdkVersion/36/g' {} \;
          find $HOME/.pub-cache -name "build.gradle.kts" -exec sed -i \
            's/flutter\.compileSdkVersion/36/g; s/flutter\.minSdkVersion/24/g; s/flutter\.targetSdkVersion/36/g' {} \;
      - name: Flutter doctor
        run: flutter doctor -v
      - name: Build APK
        run: flutter build apk --debug --verbose 2>&1
      - name: Find APK
        run: find /home/runner/work -name "*.apk" 2>/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: "**/*.apk"
          if-no-files-found: warn
