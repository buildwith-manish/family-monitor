name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
      - run: cd family_monitor && flutter pub get
      - run: cd family_monitor && flutter build apk --debug --no-tree-shake-icons
      - uses: actions/upload-artifact@v3
        with:
          name: debug-apk
          path: family_monitor/build/app/outputs/flutter-apk/app-debug.apk
