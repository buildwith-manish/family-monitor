name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
      - name: Fix compileSdkVersion
        working-directory: family_monitor
        run: |
          sed -i 's/compileSdk = [0-9]*/compileSdk = 34/' android/app/build.gradle.kts
          sed -i 's/compileSdkVersion([0-9]*)/compileSdkVersion(34)/' android/app/build.gradle.kts
          cat >> android/gradle.properties << 'EOF2'
android.useAndroidX=true
android.enableJetifier=true
kotlin.jvm.target.validation.mode=IGNORE
EOF2
      - name: Flutter pub get
        working-directory: family_monitor
        run: flutter pub get
      - name: Build APK
        working-directory: family_monitor
        run: flutter build apk --debug --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: family_monitor/build/app/outputs/flutter-apk/*.apk
